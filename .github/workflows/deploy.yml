name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # pinned: the minifier's identifier naming is version specific
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Fails the deploy if the document grows past 13 KB gzip
      # or if it ever gains a second HTTP request.
      - run: node build.mjs --check

      # Rules engine: deal shape, every move type, fuzz invariants, a real win.
      - run: node --test tests/logic.test.mjs

      # Informational only: the deployed artifact is built here, so a few bytes of
      # minifier-version drift against the committed dist/ must not block a deploy.
      - run: git diff --stat -- dist/ || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
